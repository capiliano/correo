<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Correo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#fff;
    color:#111;
    overflow:hidden;
}

/* =========================
   LOGIN
========================= */

#login{
    position:fixed;
    inset:0;
    background:#f6f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.login-box{
    width:100%;
    max-width:390px;
    background:#fff;
    padding:35px 28px;
    border-radius:16px;
    box-shadow:0 8px 35px rgba(0,0,0,.12);
}

.login-logo{
    font-size:34px;
    font-weight:600;
    color:#1a73e8;
    margin-bottom:8px;
}

.login-subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:30px;
}

.login-box h1{
    font-size:24px;
    font-weight:500;
    margin-bottom:8px;
}

.login-box p{
    color:#666;
    font-size:14px;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    height:50px;
    border:1px solid #c9c9c9;
    border-radius:6px;
    padding:0 14px;
    font-size:15px;
    margin-bottom:12px;
    outline:none;
}

.login-box input:focus{
    border:2px solid #1a73e8;
}

.login-button{
    width:100%;
    height:48px;
    border:none;
    border-radius:6px;
    background:#1a73e8;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.login-note{
    margin-top:18px;
    font-size:11px;
    line-height:1.5;
    color:#888;
}


/* =========================
   APP
========================= */

#app{
    display:none;
    height:100vh;
}


/* =========================
   BARRA SUPERIOR
========================= */

.top{
    height:72px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:20px;
}

.menu{
    width:38px;
    height:38px;
    border:none;
    background:none;
    font-size:27px;
    color:#555;
    cursor:pointer;
}

.title{
    font-size:28px;
    font-weight:400;
    flex:1;
}

.title span{
    color:#888;
    font-size:21px;
    margin-left:8px;
}

.compose-top{
    width:48px;
    height:48px;
    border:none;
    border-radius:7px;
    background:#e94335;
    color:white;
    font-size:28px;
    cursor:pointer;
}


/* =========================
   BUSCADOR
========================= */

.search{
    height:70px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.search-icon{
    font-size:34px;
    color:#666;
    margin-right:15px;
    font-weight:300;
}

.search input{
    width:100%;
    border:none;
    outline:none;
    font-size:27px;
    color:#222;
}

.search input::placeholder{
    color:#aaa;
}


/* =========================
   BANDEJA
========================= */

.inbox{
    height:calc(100vh - 142px);
    overflow-y:auto;
    background:#fff;
}

.email{
    min-height:115px;
    border-bottom:1px solid #ddd;
    padding:14px 16px 13px 18px;
    cursor:pointer;
    display:grid;
    grid-template-columns:28px 1fr auto;
    grid-template-rows:auto auto auto;
    column-gap:10px;
}

.email:hover{
    background:#fafafa;
}

.email.unread{
    background:#fff;
}

.email-check{
    width:24px;
    height:24px;
    grid-row:1 / 4;
    margin-top:20px;
}

.email-main{
    min-width:0;
}

.sender{
    font-size:22px;
    font-weight:600;
    line-height:1.15;
    margin-bottom:6px;
}

.subject{
    font-size:19px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.preview{
    color:#888;
    font-size:17px;
    line-height:1.3;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.date{
    font-size:16px;
    color:#1769d2;
    white-space:nowrap;
    padding-top:3px;
}

.star{
    font-size:31px;
    color:#ccc;
    grid-column:3;
    text-align:right;
    align-self:end;
    cursor:pointer;
    line-height:25px;
}

.star.active{
    color:#f5b400;
}


/* =========================
   MENSAJE
========================= */

#message{
    display:none;
    position:absolute;
    top:142px;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    overflow-y:auto;
}

.message-top{
    height:60px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.back{
    border:none;
    background:none;
    font-size:30px;
    color:#555;
    cursor:pointer;
    margin-right:18px;
}

.message-title{
    font-size:22px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.message-content{
    padding:25px;
}

.message-sender{
    font-size:22px;
    font-weight:600;
    margin-bottom:5px;
}

.message-address{
    color:#777;
    font-size:14px;
    margin-bottom:30px;
}

.message-body{
    font-size:18px;
    line-height:1.7;
    white-space:pre-line;
}


/* =========================
   REDACTAR
========================= */

#compose{
    display:none;
    position:fixed;
    right:25px;
    bottom:0;
    width:460px;
    background:#fff;
    border-radius:10px 10px 0 0;
    box-shadow:0 0 30px rgba(0,0,0,.25);
    z-index:5000;
}

.compose-header{
    height:48px;
    background:#f1f3f4;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.compose-header button{
    border:none;
    background:none;
    font-size:22px;
    cursor:pointer;
}

.compose-body{
    padding:10px 15px 18px;
}

.compose-body input{
    width:100%;
    height:43px;
    border:none;
    border-bottom:1px solid #ddd;
    outline:none;
    font-size:14px;
}

.compose-body textarea{
    width:100%;
    height:220px;
    border:none;
    resize:none;
    outline:none;
    padding-top:15px;
    font-size:15px;
}

.send{
    border:none;
    background:#1a73e8;
    color:white;
    padding:10px 23px;
    border-radius:20px;
    cursor:pointer;
}


/* =========================
   MENU LATERAL
========================= */

#sideMenu{
    display:none;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:285px;
    background:white;
    z-index:4000;
    box-shadow:5px 0 25px rgba(0,0,0,.2);
}

.side-title{
    height:72px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:24px;
    color:#555;
}

.side-item{
    padding:17px 25px;
    font-size:17px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.side-item:hover{
    background:#f5f5f5;
}


/* =========================
   RESPONSIVE CELULAR
========================= */

    }

</style>
</head>

<!-- =========================

<!-- =========================
     REDACTAR
========================= -->

</div>

let currentFolder="inbox";


/* =========================
   LOGIN
========================= */

function login(){

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    render();

}


/* =========================
   RENDER
========================= */

function render(){

    const inbox=document.getElementById("inbox");

    inbox.innerHTML="";

    let search=document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let filtered=emails.filter(mail=>{

        if(currentFolder==="starred"){
            return mail.star;
        }

        return mail.folder===currentFolder;

    });


    if(search){

        filtered=filtered.filter(mail=>{

            return (

                mail.sender.toLowerCase().includes(search) ||

                mail.subject.toLowerCase().includes(search) ||

                mail.preview.toLowerCase().includes(search)

            );

        });

    }


    document.getElementById("count").textContent=
        filtered.length;


    filtered.forEach(mail=>{

        const item=document.createElement("div");

        item.className="email";


        item.innerHTML=`

            <input
                class="email-check"
                type="checkbox"
                onclick="event.stopPropagation()"
            >

            <div class="email-main">

                <div class="sender">
                    ${mail.sender}
                </div>

                <div class="subject">
                    ${mail.subject}
                </div>

                <div class="preview">
                    ${mail.preview}
                </div>

            </div>

            <div>

                <div class="date">
                    ${mail.date}
                </div>

                <div
                    class="star ${mail.star ? "active":""}"
                    onclick="toggleStar(event,${mail.id})"
                >
                    ${mail.star ? "★":"☆"}
                </div>

            </div>

        `;


        item.onclick=function(){

            openMessage(mail.id);

        };


        inbox.appendChild(item);

    });

}


/* =========================
   ABRIR CORREO
========================= */

function openMessage(id){

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;

    mail.unread=false;


    document.getElementById("inbox").style.display="none";

    document.getElementById("message").style.display="block";


    document.getElementById("messageTitle").textContent=
        mail.subject;

    document.getElementById("messageSender").textContent=
        mail.sender;

    document.getElementById("messageAddress").textContent=
        "Para: emiliano.ch.mino@gmail.com";

    document.getElementById("messageBody").textContent=
        mail.body;

}


/* =========================
   CERRAR
========================= */

function closeMessage(){

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";

    render();

}


/* =========================
   ESTRELLA
========================= */

function toggleStar(event,id){

    event.stopPropagation();

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;

    mail.star=!mail.star;

    render();

}


/* =========================
   BUSCAR
========================= */

function searchEmails(){

    render();

}


/* =========================
   MENÚ
========================= */

function openMenu(){

    document.getElementById("sideMenu").style.display="block";

}

function closeMenu(){

    document.getElementById("sideMenu").style.display="none";

}


/* =========================
   CARPETAS
========================= */

function showFolder(folder){

    currentFolder=folder;

    closeMenu();

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";

    render();

}

function closeCompose(){

    const to=
        document.getElementById("to").value.trim();

    const subject=
        document.getElementById("subject").value.trim();

    const body=
        document.getElementById("body").value.trim();


    if(!to || !subject || !body){

        alert("Completa todos los campos.");

        return;

    }


    emails.unshift({

        id:Date.now(),

        sender:"Yo",

        subject:subject,

        preview:body.substring(0,80),

        date:"Ahora",

        address:"emiliano.ch.mino@gmail.com",

        body:body,

        unread:false,

        star:false,

        folder:"sent"

    });


    document.getElementById("subject").value="";

    document.getElementById("body").value="";


    closeCompose();

    alert("Correo enviado en la simulación.");

}


</script>
