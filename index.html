<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mail — Correo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --primary:#1a73e8;
    --primary-light:#e8f0fe;
    --bg:#f6f8fc;
    --white:#fff;
    --text:#202124;
    --muted:#6b7280;
    --border:#e5e7eb;
    --hover:#f1f3f4;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* =========================
   LOGIN
========================= */

#login{
    position:fixed;
    inset:0;
    background:#f6f8fc;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.login-card{
    width:100%;
    max-width:400px;
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:35px 28px;
    text-align:center;
}

.logo{
    color:var(--primary);
    font-size:30px;
    font-weight:600;
    margin-bottom:8px;
}

.demo{
    font-size:11px;
    color:#777;
    letter-spacing:.7px;
    margin-bottom:28px;
}

.login-card h2{
    font-size:22px;
    margin-bottom:8px;
}

.login-card p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}

.login-card input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid #c9cdd3;
    border-radius:7px;
    margin-bottom:12px;
    font-size:15px;
    outline:none;
}

.login-card input:focus{
    border:2px solid var(--primary);
}

.login-button{
    width:100%;
    height:46px;
    border:none;
    border-radius:7px;
    background:var(--primary);
    color:white;
    font-weight:600;
    cursor:pointer;
    margin-top:5px;
}

.demo-note{
    margin-top:18px;
    font-size:11px;
    color:#888;
    line-height:1.5;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    height:70px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:20px;
}

.logo-header{
    font-size:23px;
    color:var(--primary);
    font-weight:600;
    width:170px;
}

.menu-button{
    display:none;
    border:none;
    background:none;
    font-size:24px;
}

.search{
    flex:1;
    max-width:720px;
    position:relative;
}

.search input{
    width:100%;
    height:46px;
    border:none;
    background:#eef1f5;
    border-radius:24px;
    padding:0 20px 0 48px;
    outline:none;
    font-size:15px;
}

.search span{
    position:absolute;
    left:18px;
    top:13px;
    color:#666;
}

.header-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:16px;
}

.icon-button{
    border:none;
    background:none;
    font-size:20px;
    cursor:pointer;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#5f6368;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:14px;
}

/* =========================
   LAYOUT
========================= */

.layout{
    display:flex;
    height:calc(100vh - 70px);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:245px;
    background:white;
    padding:18px 12px;
    border-right:1px solid var(--border);
}

.compose{
    width:145px;
    height:52px;
    border:none;
    border-radius:17px;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    font-size:15px;
    cursor:pointer;
    margin-bottom:20px;
}

.compose:hover{
    background:#f5f7fa;
}

.folder{
    display:flex;
    align-items:center;
    gap:15px;
    padding:10px 20px;
    border-radius:0 18px 18px 0;
    cursor:pointer;
    font-size:14px;
    margin-bottom:3px;
}

.folder:hover{
    background:var(--hover);
}

.folder.active{
    background:var(--primary-light);
    color:#174ea6;
    font-weight:bold;
}

.folder-count{
    margin-left:auto;
}

/* =========================
   MAIN
========================= */

main{
    flex:1;
    overflow:hidden;
    padding:20px;
}

.toolbar{
    height:50px;
    display:flex;
    align-items:center;
    gap:8px;
}

.toolbar button{
    border:none;
    background:transparent;
    width:38px;
    height:38px;
    border-radius:50%;
    cursor:pointer;
    font-size:17px;
}

.toolbar button:hover{
    background:#e8eaed;
}

.mail-container{
    height:calc(100% - 50px);
    background:white;
    border-radius:12px;
    border:1px solid var(--border);
    overflow-y:auto;
}

/* =========================
   EMAIL
========================= */

.email{
    min-height:68px;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    gap:14px;
}

.email:hover{
    background:#f8fafd;
}

.email.unread{
    background:#f2f6fc;
    font-weight:bold;
}

.checkbox{
    width:17px;
    height:17px;
}

.star{
    width:24px;
    color:#777;
    font-size:19px;
}

.star.selected{
    color:#fbbc04;
}

.email-info{
    width:190px;
    flex-shrink:0;
}

.email-subject{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.email-preview{
    color:#777;
    font-weight:normal;
}

.email-date{
    width:65px;
    text-align:right;
    font-size:12px;
    color:#777;
}

/* =========================
   MESSAGE
========================= */

#message{
    display:none;
    height:100%;
    background:white;
    border-radius:12px;
    border:1px solid var(--border);
    padding:20px;
    overflow-y:auto;
}

.back{
    border:none;
    background:var(--hover);
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:25px;
}

.message-title{
    font-size:25px;
    font-weight:400;
    margin-bottom:22px;
}

.message-user{
    display:flex;
    align-items:center;
    gap:12px;
}

.message-avatar{
    width:42px;
    height:42px;
    background:#5f6368;
    border-radius:50%;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.message-content{
    margin:30px 0 0 55px;
    line-height:1.7;
    white-space:pre-line;
    font-size:15px;
}

/* =========================
   COMPOSE
========================= */

.compose-window{
    position:fixed;
    right:25px;
    bottom:0;
    width:450px;
    background:white;
    border-radius:10px 10px 0 0;
    box-shadow:0 5px 30px rgba(0,0,0,.25);
    display:none;
    z-index:1000;
}

.compose-title{
    height:45px;
    background:#f2f3f4;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14px;
}

.compose-title button{
    border:none;
    background:none;
    font-size:20px;
    cursor:pointer;
}

.compose-content{
    padding:12px;
}

.compose-content input,
.compose-content textarea{
    width:100%;
    border:none;
    border-bottom:1px solid #eee;
    outline:none;
    padding:11px 5px;
    font-size:14px;
}

.compose-content textarea{
    height:220px;
    resize:none;
    border:none;
}

.send{
    background:var(--primary);
    border:none;
    color:white;
    padding:11px 23px;
    border-radius:20px;
    cursor:pointer;
}

/* =========================
   MOBILE NAV
========================= */

.mobile-nav{
    display:none;
}

/* =========================
   DARK MODE
========================= */

body.dark{
    --bg:#111318;
    --white:#1d1f24;
    --text:#e8eaed;
    --muted:#aeb3bb;
    --border:#30343b;
}

body.dark header,
body.dark .sidebar,
body.dark .mail-container,
body.dark #message,
body.dark .compose-window{
    background:#1d1f24;
    color:#e8eaed;
}

body.dark .search input{
    background:#30343b;
    color:white;
}

body.dark .email{
    border-color:#30343b;
}

body.dark .email:hover{
    background:#25282e;
}

body.dark .email.unread{
    background:#20252d;
}

body.dark .compose-title{
    background:#292c32;
}

body.dark .compose-content input,
body.dark .compose-content textarea{
    background:#1d1f24;
    color:white;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        background:white;
    }

    header{
        height:64px;
        padding:0 13px;
        gap:12px;
    }

    .logo-header{
        width:auto;
        font-size:21px;
    }

    .menu-button{
        display:block;
    }

    .search{
        display:block;
    }

    .search input{
        height:40px;
        font-size:13px;
        padding-left:38px;
    }

    .search span{
        left:13px;
        top:10px;
    }

    .header-actions{
        gap:8px;
    }

    .header-actions .theme-button{
        display:none;
    }

    .avatar{
        width:34px;
        height:34px;
    }

    .layout{
        height:calc(100vh - 64px - 65px);
    }

    .sidebar{
        display:none;
    }

    main{
        padding:0;
        width:100%;
    }

    .toolbar{
        height:48px;
        padding:0 10px;
        border-bottom:1px solid var(--border);
    }

    .mail-container{
        height:calc(100% - 48px);
        border:none;
        border-radius:0;
    }

    .email{
        min-height:72px;
        padding:0 12px;
        gap:9px;
    }

    .checkbox{
        display:none;
    }

    .star{
        width:23px;
    }

    .email-info{
        width:105px;
        overflow:hidden;
        white-space:nowrap;
        text-overflow:ellipsis;
        font-size:14px;
    }

    .email-subject{
        font-size:14px;
    }

    .email-preview{
        display:block;
        font-size:12px;
        margin-top:3px;
        overflow:hidden;
        text-overflow:ellipsis;
    }

    .email-date{
        width:38px;
        font-size:10px;
    }

    #message{
        border:none;
        border-radius:0;
        padding:17px;
    }

    .message-title{
        font-size:21px;
        line-height:1.3;
    }

    .message-content{
        margin:25px 0 0 0;
    }

    .compose-window{
        width:100%;
        height:100%;
        right:0;
        bottom:0;
        border-radius:0;
    }

    .compose-content textarea{
        height:calc(100vh - 240px);
    }

    .mobile-nav{
        position:fixed;
        display:flex;
        bottom:0;
        left:0;
        right:0;
        height:65px;
        background:white;
        border-top:1px solid var(--border);
        z-index:500;
        justify-content:space-around;
        align-items:center;
    }

    .mobile-nav button{
        border:none;
        background:none;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:4px;
        font-size:11px;
        color:#5f6368;
    }

    .mobile-nav .active{
        color:var(--primary);
        font-weight:bold;
    }

    body.dark .mobile-nav{
        background:#1d1f24;
    }
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:380px){

    .email-info{
        width:85px;
    }

    .email-preview{
        display:none;
    }

    .logo-header{
        font-size:18px;
    }

    .search input{
        font-size:11px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="login">

    <div class="login-card">

        <div class="logo">
            Mail
        </div>

        <div class="demo">
            SERVICIO DE CORREO • DEMOSTRACIÓN
        </div>

        <h2>Iniciar sesión</h2>

        <p>
            Accede a tu bandeja de entrada
        </p>

        <input
            type="text"
            id="loginEmail"
            placeholder="Correo electrónico"
            autocomplete="off"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Contraseña"
            autocomplete="off"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            Iniciar sesión
        </button>

        <div class="demo-note">
            Interfaz ficticia para demostración.
            No se almacenan ni transmiten credenciales.
        </div>

    </div>

</section>


<!-- =========================
     APP
========================= -->

<div id="app">

<header>

    <button
        class="menu-button"
        onclick="toggleSidebar()"
    >
        ☰
    </button>

    <div class="logo-header">
        Mail
    </div>

    <div class="search">

        <span>🔍</span>

        <input
            id="search"
            type="text"
            placeholder="Buscar en el correo"
            oninput="searchEmails()"
        >

    </div>

    <div class="header-actions">

        <button
            class="icon-button theme-button"
            onclick="toggleDark()"
        >
            ⚙
        </button>

        <div class="avatar">
            EM
        </div>

    </div>

</header>


<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <button
            class="compose"
            onclick="openCompose()"
        >
            ✎ &nbsp; Redactar
        </button>

        <div
            class="folder active"
            onclick="folder('inbox',this)"
        >
            📥
            <span>Recibidos</span>
            <span class="folder-count">4</span>
        </div>

        <div
            class="folder"
            onclick="folder('starred',this)"
        >
            ⭐
            <span>Destacados</span>
        </div>

        <div
            class="folder"
            onclick="folder('sent',this)"
        >
            📤
            <span>Enviados</span>
        </div>

        <div
            class="folder"
            onclick="folder('trash',this)"
        >
            🗑
            <span>Papelera</span>
        </div>

    </aside>


    <!-- MAIN -->

    <main>

        <section id="inbox">

            <div class="toolbar">

                <button onclick="selectAll()">
                    □
                </button>

                <button onclick="deleteSelected()">
                    🗑
                </button>

                <button onclick="refresh()">
                    ↻
                </button>

            </div>

            <div
                class="mail-container"
                id="mailList"
            ></div>

        </section>


        <section id="message">

            <button
                class="back"
                onclick="closeMessage()"
            >
                ← Volver
            </button>

            <div
                class="message-title"
                id="messageTitle"
            ></div>

            <div class="message-user">

                <div
                    class="message-avatar"
                    id="messageAvatar"
                >
                </div>

                <div>

                    <strong id="messageSender"></strong>

                    <div
                        style="font-size:12px;color:#777"
                        id="messageEmail"
                    >
                    </div>

                </div>

            </div>

            <div
                class="message-content"
                id="messageContent"
            ></div>

        </section>

    </main>

</div>


<!-- MOBILE NAV -->

<nav class="mobile-nav">

    <button
        class="active"
        onclick="mobileFolder('inbox')"
    >
        <span>📥</span>
        Recibidos
    </button>

    <button
        onclick="mobileFolder('starred')"
    >
        <span>⭐</span>
        Destacados
    </button>

    <button
        onclick="openCompose()"
    >
        <span style="font-size:25px">＋</span>
        Redactar
    </button>

    <button
        onclick="mobileFolder('sent')"
    >
        <span>📤</span>
        Enviados
    </button>

</nav>


<!-- COMPOSE -->

<div
    class="compose-window"
    id="compose"
>

    <div class="compose-title">

        <strong>Nuevo mensaje</strong>

        <button onclick="closeCompose()">
            ×
        </button>

    </div>

    <div class="compose-content">

        <input
            id="to"
            placeholder="Destinatario"
            autocomplete="off"
        >

        <input
            id="subject"
            placeholder="Asunto"
            autocomplete="off"
        >

        <textarea
            id="body"
            placeholder="Escribe un mensaje..."
        ></textarea>

        <button
            class="send"
            onclick="sendMail()"
        >
            Enviar
        </button>

    </div>

</div>

</div>


<script>

/* =========================
   DATOS FICTICIOS
========================= */

let emails = [

{
id:1,
sender:"Ana Martínez",
email:"ana@example.test",
subject:"Reunión de mañana",
preview:"¿Confirmamos la reunión para mañana?",
body:
`Hola Emiliano,

¿Confirmamos la reunión para mañana?

Nos vemos a las 10:00.

Saludos,
Ana`,
date:"20:35",
unread:true,
star:false,
folder:"inbox"
},

{
id:2,
sender:"Diseño Multimedia",
email:"multimedia@example.test",
subject:"Nuevo proyecto disponible",
preview:"Ya puedes revisar los detalles del proyecto.",
body:
`Hola,

Ya puedes revisar los detalles del nuevo proyecto multimedia.

Recuerda revisar los archivos antes de la fecha indicada.

Saludos,
Equipo Multimedia`,
date:"18:42",
unread:true,
star:true,
folder:"inbox"
},

{
id:3,
sender:"Carlos",
email:"carlos@example.test",
subject:"Fotos del evento",
preview:"Te envío las fotografías que tomamos.",
body:
`Hola,

Te envío las fotografías del evento.

Cuando puedas revisa las imágenes y dime cuáles quieres utilizar.

Carlos`,
date:"16:20",
unread:false,
star:false,
folder:"inbox"
},

{
id:4,
sender:"Noticias",
email:"noticias@example.test",
subject:"Boletín semanal",
preview:"Estas son las novedades de esta semana.",
body:
`Hola,

Estas son las principales novedades de esta semana.

Gracias por leer nuestro boletín.`,
date:"12:05",
unread:false,
star:false,
folder:"inbox"
}

];


let currentFolder="inbox";


/* =========================
   LOGIN
========================= */

function login(){

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    render();

}


/* =========================
   RENDER
========================= */

function render(){

    const list=document.getElementById("mailList");

    list.innerHTML="";

    let search=document
        .getElementById("search")
        .value
        .toLowerCase();

    let filtered=emails.filter(mail=>{

        if(currentFolder==="starred")
            return mail.star;

        return mail.folder===currentFolder;

    });


    if(search){

        filtered=filtered.filter(mail=>

            mail.sender.toLowerCase().includes(search) ||
            mail.subject.toLowerCase().includes(search) ||
            mail.preview.toLowerCase().includes(search)

        );

    }


    if(filtered.length===0){

        list.innerHTML=`
            <div style="
                padding:60px 20px;
                text-align:center;
                color:#777;
            ">
                <div style="font-size:35px">📭</div>
                <br>
                No hay mensajes.
            </div>
        `;

        return;

    }


    filtered.forEach(mail=>{

        const item=document.createElement("div");

        item.className="email";

        if(mail.unread)
            item.classList.add("unread");


        item.innerHTML=`

            <input
                class="checkbox"
                type="checkbox"
                data-id="${mail.id}"
                onclick="event.stopPropagation()"
            >

            <div
                class="star ${mail.star ? "selected":""}"
                onclick="toggleStar(event,${mail.id})"
            >
                ${mail.star ? "★":"☆"}
            </div>

            <div class="email-info">
                ${mail.sender}
            </div>

            <div class="email-subject">

                ${mail.subject}

                <span class="email-preview">
                    — ${mail.preview}
                </span>

            </div>

            <div class="email-date">
                ${mail.date}
            </div>
        `;


        item.onclick=()=>openMessage(mail.id);

        list.appendChild(item);

    });

}


/* =========================
   OPEN MESSAGE
========================= */

function openMessage(id){

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;

    mail.unread=false;

    document.getElementById("inbox").style.display="none";

    document.getElementById("message").style.display="block";

    document.getElementById("messageTitle").textContent=
        mail.subject;

    document.getElementById("messageSender").textContent=
        mail.sender;

    document.getElementById("messageEmail").textContent=
        mail.email;

    document.getElementById("messageAvatar").textContent=
        mail.sender.charAt(0).toUpperCase();

    document.getElementById("messageContent").textContent=
        mail.body;

}


/* =========================
   CLOSE MESSAGE
========================= */

function closeMessage(){

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";

    render();

}


/* =========================
   STAR
========================= */

function toggleStar(event,id){

    event.stopPropagation();

    const mail=emails.find(x=>x.id===id);

    mail.star=!mail.star;

    render();

}


/* =========================
   FOLDERS
========================= */

function folder(name,element){

    currentFolder=name;

    document
        .querySelectorAll(".folder")
        .forEach(x=>x.classList.remove("active"));

    element.classList.add("active");

    closeMessage();

    render();

}


/* =========================
   MOBILE FOLDERS
========================= */

function mobileFolder(name){

    currentFolder=name;

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";

    render();

}


/* =========================
   SEARCH
========================= */

function searchEmails(){

    render();

}


/* =========================
   SELECT ALL
========================= */

function selectAll(){

    const checks=
        document.querySelectorAll(".checkbox");

    checks.forEach(check=>{

        check.checked=!check.checked;

    });

}


/* =========================
   DELETE
========================= */

function deleteSelected(){

    const selected=
        document.querySelectorAll(".checkbox:checked");

    if(selected.length===0){

        alert("Selecciona al menos un mensaje.");

        return;

    }


    selected.forEach(check=>{

        const id=Number(check.dataset.id);

        const mail=emails.find(x=>x.id===id);

        if(mail)
            mail.folder="trash";

    });


    render();

}


/* =========================
   REFRESH
========================= */

function refresh(){

    render();

}


/* =========================
   COMPOSE
========================= */

function openCompose(){

    document.getElementById("compose").style.display="block";

}


function closeCompose(){

    document.getElementById("compose").style.display="none";

}


/* =========================
   SEND
========================= */

function sendMail(){

    const to=document
        .getElementById("to")
        .value
        .trim();

    const subject=document
        .getElementById("subject")
        .value
        .trim();

    const body=document
        .getElementById("body")
        .value
        .trim();


    if(!to || !subject || !body){

        alert("Completa todos los campos.");

        return;

    }


    emails.unshift({

        id:Date.now(),

        sender:"Yo",

        email:"demo@example.test",

        subject:subject,

        preview:body.substring(0,60),

        body:body,

        date:"Ahora",

        unread:false,

        star:false,

        folder:"sent"

    });


    document.getElementById("to").value="";

    document.getElementById("subject").value="";

    document.getElementById("body").value="";


    closeCompose();

    alert("Mensaje enviado en la simulación.");

}

}
