<html lang="es">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Correo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#fff;
    color:#111;
    overflow:hidden;
}

/* =========================
   LOGIN
========================= */

#login{
    position:fixed;
    inset:0;
    background:#f6f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.login-box{
    width:100%;
    max-width:390px;
    background:#fff;
    padding:32px 26px;
    border-radius:16px;
    box-shadow:0 8px 35px rgba(0,0,0,.12);
}

.login-logo{
    font-size:30px;
    font-weight:600;
    color:#1a73e8;
    margin-bottom:7px;
}

.login-subtitle{
    color:#777;
    font-size:12px;
    margin-bottom:27px;
}

.login-box h1{
    font-size:22px;
    font-weight:500;
    margin-bottom:7px;
}

.login-box p{
    color:#666;
    font-size:13px;
    margin-bottom:22px;
}

.login-box input{
    width:100%;
    height:47px;
    border:1px solid #c9c9c9;
    border-radius:6px;
    padding:0 13px;
    font-size:14px;
    margin-bottom:11px;
    outline:none;
}

.login-box input:focus{
    border:2px solid #1a73e8;
}

.login-button{
    width:100%;
    height:46px;
    border:none;
    border-radius:6px;
    background:#1a73e8;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.login-note{
    margin-top:16px;
    font-size:10px;
    line-height:1.5;
    color:#888;
}


/* =========================
   APP
========================= */

#app{
    display:none;
    height:100vh;
}


/* =========================
   BARRA SUPERIOR
========================= */

.top{
    height:66px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:17px;
}

.menu{
    width:36px;
    height:36px;
    border:none;
    background:none;
    font-size:24px;
    color:#555;
    cursor:pointer;
}

.title{
    font-size:24px;
    font-weight:400;
    flex:1;
}

.title span{
    color:#888;
    font-size:18px;
    margin-left:7px;
}

.compose-top{
    width:44px;
    height:44px;
    border:none;
    border-radius:7px;
    background:#e94335;
    color:white;
    font-size:25px;
    cursor:pointer;
}


/* =========================
   BUSCADOR
========================= */

.search{
    height:62px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.search-icon{
    font-size:29px;
    color:#666;
    margin-right:13px;
    font-weight:300;
}

.search input{
    width:100%;
    border:none;
    outline:none;
    font-size:22px;
    color:#222;
}

.search input::placeholder{
    color:#aaa;
}


/* =========================
   BANDEJA
========================= */

.inbox{
    height:calc(100vh - 128px);
    overflow-y:auto;
    background:#fff;
}

.email{
    min-height:103px;
    border-bottom:1px solid #ddd;
    padding:12px 14px 11px 16px;
    cursor:pointer;
    display:grid;
    grid-template-columns:25px 1fr auto;
    grid-template-rows:auto auto auto;
    column-gap:9px;
}

.email:hover{
    background:#fafafa;
}

.email-check{
    width:21px;
    height:21px;
    grid-row:1 / 4;
    margin-top:18px;
}

.email-main{
    min-width:0;
}

.sender{
    font-size:19px;
    font-weight:600;
    line-height:1.15;
    margin-bottom:5px;
}

.subject{
    font-size:16px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.preview{
    color:#888;
    font-size:14px;
    line-height:1.3;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.date{
    font-size:14px;
    color:#1769d2;
    white-space:nowrap;
    padding-top:2px;
}

.star{
    font-size:27px;
    color:#ccc;
    grid-column:3;
    text-align:right;
    align-self:end;
    cursor:pointer;
    line-height:23px;
}

.star.active{
    color:#f5b400;
}


/* =========================
   MENSAJE
========================= */

#message{
    display:none;
    position:absolute;
    top:128px;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    overflow-y:auto;
}

.message-top{
    height:56px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 17px;
}

.back{
    border:none;
    background:none;
    font-size:27px;
    color:#555;
    cursor:pointer;
    margin-right:16px;
}

.message-title{
    font-size:19px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.message-content{
    padding:22px;
}

.message-sender{
    font-size:20px;
    font-weight:600;
    margin-bottom:5px;
}

.message-address{
    color:#777;
    font-size:13px;
    margin-bottom:26px;
}

.message-body{
    font-size:16px;
    line-height:1.65;
    white-space:pre-line;
}


/* =========================
   REDACTAR
========================= */

#compose{
    display:none;
    position:fixed;
    right:22px;
    bottom:0;
    width:450px;
    background:#fff;
    border-radius:10px 10px 0 0;
    box-shadow:0 0 30px rgba(0,0,0,.25);
    z-index:5000;
}

.compose-header{
    height:46px;
    background:#f1f3f4;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14px;
}

.compose-header button{
    border:none;
    background:none;
    font-size:21px;
    cursor:pointer;
}

.compose-body{
    padding:9px 14px 16px;
}

.compose-body input{
    width:100%;
    height:40px;
    border:none;
    border-bottom:1px solid #ddd;
    outline:none;
    font-size:13px;
}

.compose-body textarea{
    width:100%;
    height:210px;
    border:none;
    resize:none;
    outline:none;
    padding-top:14px;
    font-size:14px;
}

.send{
    border:none;
    background:#1a73e8;
    color:white;
    padding:9px 21px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
}


/* =========================
   MENU LATERAL
========================= */

#sideMenu{
    display:none;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:275px;
    background:white;
    z-index:4000;
    box-shadow:5px 0 25px rgba(0,0,0,.2);
}

.side-title{
    height:66px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
    font-size:21px;
    color:#555;

    font-size:15px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.side-item:hover{
    background:#f5f5f5;

    }

        >

        <button

        >
            Iniciar sesión
        </button>

        <div class="login-note">
            Acceso de demostración. No se envían ni almacenan contraseñas.
        </div>

    </div>

</div>


<!-- APP -->

<div id="app">


    <div class="top">

        <button
            class="menu"
            onclick="openMenu()"
        >
            ☰
        </button>

        <div class="title">
            <span id="folderTitle">Principal</span>
            <span id="count">14</span>
        </div>

        <button
            class="compose-top"
            onclick="openCompose()"
        >
            ✎
        </button>

    </div>


    <!-- BUSCADOR -->

    <div class="search">

        <div class="search-icon">
            ⌕
        </div>

        <input
            id="search"
            type="text"
            placeholder="Buscar"
            oninput="searchEmails()"
        >

    </div>


    <!-- BANDEJA -->

    <div
        class="inbox"
        id="inbox"
    ></div>


    <!-- MENSAJE -->

    <div id="message">

        <div class="message-top">

            <button
                class="back"
                onclick="closeMessage()"
            >
                ←
            </button>

            <div
                class="message-title"
                id="messageTitle"
            ></div>

        </div>

        <div class="message-content">

            <div
                class="message-sender"
                id="messageSender"
            ></div>

            <div
                class="message-address"
                id="messageAddress"
            ></div>

            <div
                class="message-body"
                id="messageBody"
            ></div>

        </div>

    </div>

</div>


<!-- MENÚ -->

<div id="sideMenu">

    <div class="side-title">

        <button
            class="menu"
            onclick="closeMenu()"
        >
            ×
        </button>

        Correo

    </div>

    <div
        class="side-item"
        onclick="showFolder('inbox')"
    >
        Principal
    </div>

    <div
        class="side-item"
        onclick="showFolder('starred')"
    >
        Destacados
    </div>

    <div
        class="side-item"
        onclick="showFolder('sent')"
    >
        Enviados
    </div>

    <div
        class="side-item"
        onclick="showFolder('trash')"
    >
        Papelera
    </div>

</div>


<!-- REDACTAR -->

<div id="compose">

    <div class="compose-header">

        <strong>Nuevo correo</strong>

        <button onclick="closeCompose()">
            ×
        </button>

    </div>

    <div class="compose-body">

        <input
            id="to"
            placeholder="Para"
        >

        <input
            id="subject"
            placeholder="Asunto"
        >

        <textarea
            id="body"
            placeholder="Escribe un mensaje"
        ></textarea>

        <button
            class="send"
            onclick="sendEmail()"
        >
            Enviar
        </button>

    </div>

</div>

let currentFolder="inbox";


/* =========================
   LOGIN
========================= */

function login(){

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    render();

}


/* =========================
   RENDER
========================= */

function render(){

    const inbox=document.getElementById("inbox");

    inbox.innerHTML="";

    let search=document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let filtered=emails.filter(mail=>{

        if(currentFolder==="starred"){
            return mail.star;
        }

        return mail.folder===currentFolder;

    });


    if(search){

        filtered=filtered.filter(mail=>{

            return (

                mail.sender.toLowerCase().includes(search) ||

                mail.subject.toLowerCase().includes(search) ||

                mail.preview.toLowerCase().includes(search) ||

                (mail.to && mail.to.toLowerCase().includes(search))

            );

        });

    }


    document.getElementById("count").textContent=
        filtered.length;


    filtered.forEach(mail=>{

        const item=document.createElement("div");

        item.className="email";


        item.innerHTML=`

            <input
                class="email-check"
                type="checkbox"
                onclick="event.stopPropagation()"
            >

            <div class="email-main">

                <div class="sender">
                    ${mail.sender}
                </div>

                <div class="subject">
                    ${mail.subject}
                </div>

                <div class="preview">
                    ${mail.preview}
                </div>

            </div>

            <div>

                <div class="date">
                    ${mail.date}
                </div>

                <div
                    class="star ${mail.star ? "active":""}"
                    onclick="toggleStar(event,${mail.id})"
                >
                    ${mail.star ? "★":"☆"}
                </div>

            </div>

        `;


        item.onclick=function(){

            openMessage(mail.id);

        };


        inbox.appendChild(item);

    });

}


/* =========================
   ABRIR CORREO
========================= */

function openMessage(id){

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;

    mail.unread=false;


    document.getElementById("inbox").style.display="none";

    document.getElementById("message").style.display="block";


    document.getElementById("messageTitle").textContent=
        mail.subject;

    document.getElementById("messageSender").textContent=
        mail.sender;


    if(mail.folder==="sent"){

        document.getElementById("messageAddress").textContent=
            "De: " + mail.address + "  •  Para: " + mail.to;

    }else{

        document.getElementById("messageAddress").textContent=
            "Para: usuario";

    }


    document.getElementById("messageBody").textContent=
        mail.body;

}


/* =========================
   CERRAR MENSAJE
========================= */

function closeMessage(){

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";

    render();

}


/* =========================
   ESTRELLA
========================= */

function toggleStar(event,id){

    event.stopPropagation();

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;

    mail.star=!mail.star;

    render();

}

    document.getElementById("sideMenu").style.display="block";

}

function closeMenu(){

}


/* =========================
   CARPETAS
========================= */

function showFolder(folder){

    currentFolder=folder;

    closeMenu();

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";


    const titles={

        inbox:"Principal",

        starred:"Destacados",

        sent:"Enviados",

        trash:"Papelera"

    };


    document.getElementById("folderTitle").textContent=
        titles[folder] || "Correo";


    render();

}


/* =========================
   REDACTAR
========================= */

function openCompose(){

    document.getElementById("compose").style.display="block";

    document.getElementById("to").value="";

    document.getElementById("subject").value="";

    document.getElementById("body").value="";

}


function closeCompose(){

    document.getElementById("compose").style.display="none";

}


/* =========================
   ENVIAR
========================= */

function sendEmail(){

    const to=
        document.getElementById("to").value.trim();

    const subject=
        document.getElementById("subject").value.trim();

    const body=
        document.getElementById("body").value.trim();


    if(!to || !subject || !body){

        alert("Completa todos los campos.");

        return;

    }


    emails.unshift({

        id:Date.now(),

        sender:"Yo",

        subject:subject,

        preview:body.substring(0,80),

        date:"Ahora",

        address:"emiliano.ch.mino@gmail.com",

        to:to,

        body:body,

        unread:false,

        star:false,

        folder:"sent"

    });


    document.getElementById("subject").value="";

    document.getElementById("body").value="";


    closeCompose();

    alert("Mensaje guardado en Enviados.");

}
