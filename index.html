<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Correo</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    background:#fff;
    color:#202124;
    overflow:hidden;
}


/* =====================================================
   LOGIN
===================================================== */

#login{
    position:fixed;
    inset:0;
    background:#f6f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.login-box{
    width:100%;
    max-width:390px;
    background:#fff;
    padding:32px 26px;
    border-radius:16px;
    box-shadow:0 8px 35px rgba(0,0,0,.12);
}

.login-logo{
    font-size:30px;
    font-weight:600;
    color:#1a73e8;
    margin-bottom:7px;
}

.login-subtitle{
    color:#777;
    font-size:12px;
    margin-bottom:27px;
}

.login-box h1{
    font-size:22px;
    font-weight:500;
    margin-bottom:7px;
}

.login-box p{
    color:#666;
    font-size:13px;
    margin-bottom:22px;
}

.login-box input{
    width:100%;
    height:47px;
    border:1px solid #c9c9c9;
    border-radius:6px;
    padding:0 13px;
    font-size:14px;
    margin-bottom:11px;
    outline:none;
}

.login-box input:focus{
    border:2px solid #1a73e8;
}

.login-button{
    width:100%;
    height:46px;
    border:none;
    border-radius:6px;
    background:#1a73e8;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.login-note{
    margin-top:16px;
    font-size:10px;
    line-height:1.5;
    color:#888;
}


/* =====================================================
   APP
===================================================== */

#app{
    display:none;
    height:100vh;
    background:#fff;
}


/* =====================================================
   BARRA SUPERIOR
===================================================== */

.top{
    height:66px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:17px;
    background:#fff;
}

.menu{
    width:36px;
    height:36px;
    border:none;
    background:none;
    font-size:24px;
    color:#555;
    cursor:pointer;
}

.title{
    font-size:24px;
    font-weight:400;
    flex:1;
}

.title span{
    color:#888;
    font-size:18px;
    margin-left:7px;
}

.compose-top{
    width:44px;
    height:44px;
    border:none;
    border-radius:7px;
    background:#e94335;
    color:white;
    font-size:25px;
    cursor:pointer;
}


/* =====================================================
   BUSCADOR
===================================================== */

.search{
    height:62px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
    background:#fff;
}

.search-icon{
    font-size:29px;
    color:#666;
    margin-right:13px;
}

.search input{
    width:100%;
    border:none;
    outline:none;
    font-size:21px;
    color:#222;
}

.search input::placeholder{
    color:#aaa;
}


/* =====================================================
   BANDEJA
===================================================== */

.inbox{
    height:calc(100vh - 128px);
    overflow-y:auto;
    background:#fff;
}

.email{
    min-height:103px;
    border-bottom:1px solid #ddd;
    padding:12px 14px 11px 16px;
    cursor:pointer;
    display:grid;
    grid-template-columns:25px 1fr auto;
    grid-template-rows:auto auto auto;
    column-gap:9px;
}

.email:hover{
    background:#fafafa;
}

.email-check{
    width:21px;
    height:21px;
    grid-row:1 / 4;
    margin-top:18px;
}

.email-main{
    min-width:0;
}

.sender{
    font-size:18px;
    font-weight:600;
    line-height:1.15;
    margin-bottom:5px;
}

.subject{
    font-size:15.5px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.preview{
    color:#888;
    font-size:13.5px;
    line-height:1.3;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.date{
    font-size:13px;
    color:#1769d2;
    white-space:nowrap;
    padding-top:2px;
}

.star{
    font-size:26px;
    color:#ccc;
    grid-column:3;
    text-align:right;
    align-self:end;
    cursor:pointer;
    line-height:23px;
}

.star.active{
    color:#f5b400;
}


/* =====================================================
   CORREO ABIERTO
===================================================== */

#message{
    display:none;
    position:absolute;
    top:128px;
    left:0;
    right:0;
    bottom:0;
    background:#f5f6f8;
    overflow-y:auto;
}


/* CABECERA */

.message-top{
    height:57px;
    border-bottom:1px solid #d9d9d9;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:#fff;
    position:sticky;
    top:0;
    z-index:10;
}

.back{
    border:none;
    background:none;
    font-size:29px;
    color:#444;
    cursor:pointer;
    margin-right:17px;
}

.message-title{
    font-size:18px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* CONTENEDOR */

.message-card{
    background:#fff;
    margin:0;
    min-height:calc(100vh - 185px);
    padding:25px 32px 90px;
    border-bottom:1px solid #ddd;
}


/* REMITENTE */

.message-header{
    display:flex;
    align-items:flex-start;
    gap:13px;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#1769d2;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:19px;
    font-weight:500;
}

.sender-info{
    flex:1;
    min-width:0;
}

.message-sender{
    font-size:19px;
    font-weight:600;
    color:#202124;
    line-height:1.2;
}

.message-address{
    font-size:13px;
    color:#6b6b6b;
    margin-top:5px;
    line-height:1.4;
}

.message-date{
    font-size:12px;
    color:#777;
    white-space:nowrap;
    margin-top:4px;
}


/* DESTINATARIO */

.to-line{
    font-size:13px;
    color:#777;
    margin-top:8px;
}


/* ADJUNTOS */

.attachments{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:22px;
    padding-bottom:5px;
}

.attachment{
    min-width:190px;
    height:62px;
    border:1px solid #d8d8d8;
    border-radius:8px;
    display:flex;
    align-items:center;
    padding:9px;
    background:#fff;
}

.pdf-icon{
    width:34px;
    height:38px;
    border:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:9px;
    font-size:10px;
    color:#d84b3e;
    font-weight:bold;
}

.attachment-name{
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.attachment-size{
    color:#777;
    font-size:11px;
    margin-top:3px;
}


/* CUERPO */

.message-divider{
    border:0;
    border-top:1px solid #ddd;
    margin:20px 0 28px;
}

.message-body{
    font-size:17px;
    line-height:1.75;
    color:#282828;
    white-space:pre-line;
    max-width:900px;
}

.message-body a{
    color:#1769d2;
    text-decoration:none;
    word-break:break-all;
}

.message-body a:hover{
    text-decoration:underline;
}


/* BOTÓN RESPONDER */

.reply-area{
    margin-top:45px;
    border-top:1px solid #eee;
    padding-top:22px;
}

.reply-button{
    height:48px;
    border:1px solid #c9c9c9;
    border-radius:25px;
    background:#fff;
    padding:0 22px;
    color:#444;
    font-size:15px;
    cursor:pointer;
}

.reply-button:hover{
    background:#f5f5f5;
}


/* =====================================================
   MENÚ LATERAL
===================================================== */

#sideMenu{
    display:none;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:275px;
    background:white;
    z-index:4000;
    box-shadow:5px 0 25px rgba(0,0,0,.2);
}

.side-title{
    height:66px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 18px;
    font-size:21px;
    color:#555;
}

.side-item{
    padding:15px 23px;
    font-size:15px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.side-item:hover{
    background:#f5f5f5;
}


/* =====================================================
   REDACTAR
===================================================== */

#compose{
    display:none;
    position:fixed;
    right:22px;
    bottom:0;
    width:450px;
    background:#fff;
    border-radius:10px 10px 0 0;
    box-shadow:0 0 30px rgba(0,0,0,.25);
    z-index:5000;
}

.compose-header{
    height:46px;
    background:#f1f3f4;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:14px;
}

.compose-header button{
    border:none;
    background:none;
    font-size:21px;
    cursor:pointer;
}

.compose-body{
    padding:9px 14px 16px;
}

.compose-body input{
    width:100%;
    height:40px;
    border:none;
    border-bottom:1px solid #ddd;
    outline:none;
    font-size:13px;
}

.compose-body textarea{
    width:100%;
    height:210px;
    border:none;
    resize:none;
    outline:none;
    padding-top:14px;
    font-size:14px;
}

.send{
    border:none;
    background:#1a73e8;
    color:white;
    padding:9px 21px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .top{
        height:66px;
        padding:0 11px;
        gap:8px;
    }

    .menu{
        width:40px;
        font-size:25px;
    }

    .title{
        font-size:23px;
        text-align:center;
    }

    .title span{
        font-size:17px;
    }

    .compose-top{
        width:43px;
        height:43px;
        font-size:24px;
    }

    .search{
        height:62px;
        padding:0 16px;
    }

    .search-icon{
        font-size:28px;
        margin-right:10px;
    }

    .search input{
        font-size:21px;
    }

    .email{
        min-height:105px;
        padding:12px 12px 11px 11px;
    }

    .sender{
        font-size:18px;
    }

    .subject{
        font-size:15px;
    }

    .preview{
        font-size:13px;
    }

    .date{
        font-size:12.5px;
    }


    /* CORREO ABIERTO */

    #message{
        top:128px;
        background:#f5f6f8;
    }

    .message-top{
        height:56px;
        padding:0 12px;
    }

    .message-title{
        font-size:17px;
    }

    .message-card{
        padding:20px 16px 80px;
        min-height:calc(100vh - 184px);
    }

    .avatar{
        width:42px;
        height:42px;
        min-width:42px;
        font-size:16px;
    }

    .message-sender{
        font-size:17px;
    }

    .message-address{
        font-size:12px;
    }

    .message-date{
        font-size:11px;
    }

    .to-line{
        font-size:12px;
    }

    .message-body{
        font-size:16px;
        line-height:1.7;
    }

    .attachment{
        min-width:180px;
    }

    .reply-button{
        width:100%;
        text-align:left;
    }


    /* REDACTAR */

    #compose{
        width:100%;
        height:100%;
        right:0;
        bottom:0;
        border-radius:0;
    }

    .compose-body textarea{
        height:calc(100vh - 220px);
    }

}


/* =====================================================
   PANTALLAS MUY PEQUEÑAS
===================================================== */

@media(max-width:380px){

    .title{
        font-size:21px;
    }

    .title span{
        font-size:16px;
    }

    .email{
        min-height:99px;
    }

    .sender{
        font-size:17px;
    }

    .subject{
        font-size:14px;
    }

    .preview{
        font-size:12.5px;
    }

    .message-card{
        padding:18px 13px 70px;
    }

    .message-body{
        font-size:15px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login">

    <div class="login-box">

        <div class="login-logo">
            Correo
        </div>

        <div class="login-subtitle">
            Servicio de correo electrónico
        </div>

        <h1>Iniciar sesión</h1>

        <p>
            Accede a tu bandeja de entrada
        </p>

        <input
            id="loginEmail"
            type="text"
            placeholder="Correo electrónico"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Contraseña de demostración"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            Iniciar sesión
        </button>

        <div class="login-note">
            Acceso de demostración. No se envían ni almacenan contraseñas.
        </div>

    </div>

</div>



<!-- =====================================================
     APLICACIÓN
===================================================== -->

<div id="app">


    <!-- BARRA SUPERIOR -->

    <div class="top">

        <button
            class="menu"
            onclick="openMenu()"
        >
            ☰
        </button>

        <div class="title">
            <span id="folderTitle">Principal</span>
            <span id="count">10</span>
        </div>

        <button
            class="compose-top"
            onclick="openCompose()"
        >
            ✎
        </button>

    </div>


    <!-- BUSCADOR -->

    <div class="search">

        <div class="search-icon">
            ⌕
        </div>

        <input
            id="search"
            type="text"
            placeholder="Buscar"
            oninput="searchEmails()"
        >

    </div>


    <!-- BANDEJA -->

    <div
        class="inbox"
        id="inbox"
    ></div>


    <!-- =================================================
         MENSAJE ABIERTO
    ================================================== -->

    <div id="message">

        <div class="message-top">

            <button
                class="back"
                onclick="closeMessage()"
            >
                ←
            </button>

            <div
                class="message-title"
                id="messageTitle"
            ></div>

        </div>


        <div class="message-card">

            <div class="message-header">

                <div
                    class="avatar"
                    id="messageAvatar"
                >
                    EM
                </div>

                <div class="sender-info">

                    <div
                        class="message-sender"
                        id="messageSender"
                    ></div>

                    <div
                        class="message-address"
                        id="messageAddress"
                    ></div>

                    <div
                        class="to-line"
                        id="messageTo"
                    ></div>

                </div>

                <div
                    class="message-date"
                    id="messageDate"
                ></div>

            </div>


            <!-- ADJUNTOS -->

            <div
                class="attachments"
                id="attachments"
                style="display:none;"
            >

                <div class="attachment">

                    <div class="pdf-icon">
                        PDF
                    </div>

                    <div>

                        <div class="attachment-name">
                            Documento.pdf
                        </div>

                        <div class="attachment-size">
                            PDF
                        </div>

                    </div>

                </div>

            </div>


            <hr class="message-divider">


            <div
                class="message-body"
                id="messageBody"
            ></div>


            <div class="reply-area">

                <button
                    class="reply-button"
                    onclick="replyMessage()"
                >
                    ↩ &nbsp; Responder
                </button>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     MENÚ LATERAL
===================================================== -->

<div id="sideMenu">

    <div class="side-title">

        <button
            class="menu"
            onclick="closeMenu()"
        >
            ×
        </button>

        Correo

    </div>

    <div
        class="side-item"
        onclick="showFolder('inbox')"
    >
        Principal
    </div>

    <div
        class="side-item"
        onclick="showFolder('starred')"
    >
        Destacados
    </div>

    <div
        class="side-item"
        onclick="showFolder('sent')"
    >
        Enviados
    </div>

    <div
        class="side-item"
        onclick="showFolder('trash')"
    >
        Papelera
    </div>

</div>



<!-- =====================================================
     REDACTAR
===================================================== -->

<div id="compose">

    <div class="compose-header">

        <strong>Nuevo correo</strong>

        <button onclick="closeCompose()">
            ×
        </button>

    </div>

    <div class="compose-body">

        <input
            id="to"
            placeholder="Para"
        >

        <input
            id="subject"
            placeholder="Asunto"
        >

        <textarea
            id="body"
            placeholder="Escribe un mensaje"
        ></textarea>

        <button
            class="send"
            onclick="sendEmail()"
        >
            Enviar
        </button>

    </div>

</div>

let currentFolder="inbox";


/* =====================================================
   LOGIN
===================================================== */

function login(){

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    render();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    const inbox=document.getElementById("inbox");

    inbox.innerHTML="";

    let search=document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    let filtered=emails.filter(mail=>{

        if(currentFolder==="starred"){
            return mail.star;
        }

        return mail.folder===currentFolder;

    });


    if(search){

        filtered=filtered.filter(mail=>{

            return (

                mail.sender.toLowerCase().includes(search) ||

                mail.subject.toLowerCase().includes(search) ||

                mail.preview.toLowerCase().includes(search) ||

                (mail.to && mail.to.toLowerCase().includes(search))

            );

        });

    }


    document.getElementById("count").textContent=
        filtered.length;


    filtered.forEach(mail=>{

        const item=document.createElement("div");

        item.className="email";


        item.innerHTML=`

            <input
                class="email-check"
                type="checkbox"
                onclick="event.stopPropagation()"
            >

            <div class="email-main">

                <div class="sender">
                    ${mail.sender}
                </div>

                <div class="subject">
                    ${mail.subject}
                </div>

                <div class="preview">
                    ${mail.preview}
                </div>

            </div>

            <div>

                <div class="date">
                    ${mail.date}
                </div>

                <div
                    class="star ${mail.star ? "active":""}"
                    onclick="toggleStar(event,${mail.id})"
                >
                    ${mail.star ? "★":"☆"}
                </div>

            </div>

        `;


        item.onclick=function(){

            openMessage(mail.id);

        };


        inbox.appendChild(item);

    });

}


/* =====================================================
   ABRIR CORREO
===================================================== */

function openMessage(id){

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;


    mail.unread=false;


    document.getElementById("inbox").style.display="none";

    document.getElementById("message").style.display="block";


    /* ASUNTO */

    document.getElementById("messageTitle").textContent=
        mail.subject;


    /* REMITENTE */

    document.getElementById("messageSender").textContent=
        mail.sender;


    /* DIRECCIÓN */

    document.getElementById("messageAddress").textContent=
        mail.address;


    /* DESTINATARIO */

    if(mail.to){

        document.getElementById("messageTo").textContent=
            "Para: " + mail.to;

    }else{

        document.getElementById("messageTo").textContent=
            "";

    }


    /* FECHA */

    document.getElementById("messageDate").textContent=
        mail.fullDate || mail.date;


    /* AVATAR */

    if(mail.sender==="Yo"){

        document.getElementById("messageAvatar").textContent="EM";

    }else{

        document.getElementById("messageAvatar").textContent=
            mail.sender.substring(0,2).toUpperCase();

    }


    /* CUERPO */

    const bodyElement=
        document.getElementById("messageBody");


    /*
       Se convierte únicamente el enlace de Canva
       en un enlace visual.
    */

    let bodyHTML=
        escapeHTML(mail.body);


    bodyHTML=bodyHTML.replace(
        /https:\/\/canva\.link\/7xrzj49wlcy09z0/g,
        '<a href="https://canva.link/7xrzj49wlcy09z0" target="_blank">https://canva.link/7xrzj49wlcy09z0</a>'
    );


    bodyElement.innerHTML=bodyHTML;


    /* ADJUNTOS */

    document.getElementById("attachments").style.display="none";


    render();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CERRAR MENSAJE
===================================================== */

function closeMessage(){

    document.getElementById("message").style.display="none";

    document.getElementById("inbox").style.display="block";

    render();

}


/* =====================================================
   ESTRELLA
===================================================== */

function toggleStar(event,id){

    event.stopPropagation();

    const mail=emails.find(x=>x.id===id);

    if(!mail)return;

    mail.star=!mail.star;

    render();

}

function sendEmail(){

    const to=
        document.getElementById("to").value.trim();

    const subject=
        document.getElementById("subject").value.trim();

    const body=
        document.getElementById("body").value.trim();


    if(!to || !subject || !body){

        alert("Completa todos los campos.");

        return;

    }


    emails.unshift({

        id:Date.now(),

        sender:"Yo",

        subject:subject,

        preview:body.substring(0,80),

        date:"Ahora",

        fullDate:"Ahora",

        address:"emiliano.ch.mino@gmail.com",

        to:to,

        body:body,

        unread:false,

        star:false,

        folder:"sent"

    });


    document.getElementById("subject").value="";

    document.getElementById("body").value="";


    closeCompose();

    alert("Mensaje guardado en Enviados.");

}
